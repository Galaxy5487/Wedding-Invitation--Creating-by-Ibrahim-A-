<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#fdf6f0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="30" fill="url(#bgGrad)" />
  <rect width="90" height="90" x="5" y="5" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  
  <!-- Elegant Botanical Monogram / Ornament -->
  <g transform="translate(50, 50) scale(0.85)">
    <!-- Delicate floral petals -->
    <path d="M 0,-35 C 10,-20 15,-10 0,0 C -15,-10 -10,-20 0,-35 Z" fill="url(#roseGrad)" opacity="0.2" />
    <path d="M 0,35 C 10,20 15,10 0,0 C -15,10 -10,20 0,35 Z" fill="url(#roseGrad)" opacity="0.2" />
    <path d="M -35,0 C -20,10 -10,15 0,0 C -10,-15 -20,-10 -35,0 Z" fill="url(#roseGrad)" opacity="0.2" />
    <path d="M 35,0 C 20,10 10,15 0,0 C 10,-15 20,-10 35,0 Z" fill="url(#roseGrad)" opacity="0.2" />
    
    <!-- Botanical line art (leaves) -->
    <path d="M 0,0 Q 15,-25 30,-20 Q 20,-5 0,0" fill="none" stroke="#6b8e23" stroke-width="1.5" />
    <path d="M 0,0 Q -15,-25 -30,-20 Q -20,-5 0,0" fill="none" stroke="#6b8e23" stroke-width="1.5" />
    
    <!-- Central Monogram Letters 'F' & 'A' (Fardeen & Anjum) in calligraphy style -->
    <text x="-8" y="8" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#4d5d3b" text-anchor="middle">F</text>
    <text x="8" y="16" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#aa7c11" text-anchor="middle">A</text>
    
    <!-- Small spark/gold dots -->
    <circle cx="0" cy="-12" r="2" fill="url(#goldGrad)" />
    <circle cx="-12" cy="12" r="1.5" fill="url(#goldGrad)" />
    <circle cx="12" cy="-12" r="1.5" fill="url(#goldGrad)" />
  </g>
</svg>
